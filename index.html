<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سامانه صدور کارت همیار مشاور</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#eef3f4;--pn:#fff;--ink:#12303a;--mut:#51656d;--ln:#d5e0e3;--ac:#0a6f82;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1f;--pn:#14262d;--ink:#e6f1f3;--mut:#9db4bb;--ln:#27424b;--ac:#4cc3c6;--on:#062b33}}
:root[data-theme="dark"]{--bg:#0d1a1f;--pn:#14262d;--ink:#e6f1f3;--mut:#9db4bb;--ln:#27424b;--ac:#4cc3c6;--on:#062b33}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px}
#app{position:relative;z-index:0;background:var(--bg);height:100vh;display:none;flex-direction:column;overflow:hidden}.ok #app{display:flex}
header{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--pn);border-bottom:1px solid var(--ln)}
header img{width:46px;height:46px;border-radius:10px}
h1{margin:0;font-size:20px;font-weight:900}header p{margin:0;color:var(--mut);font-size:13px}
main{flex:1;min-height:0;display:grid;grid-template-columns:430px 1fr;gap:20px;padding:16px 24px 18px}
#side{display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 0 28px 8px;scrollbar-width:thin}.nv{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;gap:6px;flex-wrap:wrap;padding-bottom:8px}.nv button{flex:1;min-height:34px;padding:4px 8px;font-size:13px}fieldset{scroll-margin-top:52px}
fieldset{margin:0;border:1px solid var(--ln);border-radius:14px;background:var(--pn);padding:14px 16px 16px}
legend{font-weight:900;padding:0 8px;font-size:14px}
label{display:block;color:var(--mut);font-size:12.5px;margin:10px 0 4px}
input[type=text],input[type=password]{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible,select:focus{outline:2px solid var(--ac);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--ac)}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--pn);color:var(--ink);padding:8px 14px;border-radius:9px;min-height:40px}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
button:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
#list{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto;margin-bottom:10px}
.it{display:flex;gap:6px}.it button:first-child{flex:1;text-align:right}.it.on button:first-child{border-color:var(--ac);font-weight:700}
.sw{width:56px;height:36px;flex:none;border-radius:9px;border:2px solid var(--ln)}.sw.on{border-color:var(--ink)}
#work{min-height:0;display:flex;flex-direction:column;gap:12px}
#stage{flex:1;min-height:0;background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:center}
#vp{position:relative}#card{width:960px;height:600px;transform-origin:0 0;position:absolute;top:0;left:0}
#st{min-height:22px;color:var(--mut);font-size:13px}
#hold{position:fixed;top:0;left:0;z-index:-1;width:960px;height:600px;pointer-events:none}
#sheet{display:none}
@media (max-width:1000px){#app{height:auto;overflow:visible}main{grid-template-columns:1fr}#side{overflow:visible}#work{order:-1}#stage{flex:none}}header button{margin-inline-start:auto}#gate{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:linear-gradient(120deg,#0a3a5c,#0a6f82 55%,#0c9a98);padding:20px}.ok #gate{display:none}#gf{width:min(380px,100%);background:#fbfaf5;color:#12303a;border:2px solid #c9a24b;border-radius:20px;padding:28px 28px 24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}#gf img{width:84px;height:84px;border-radius:16px;border:2px solid #c9a24b}#gf h2{margin:10px 0 2px;font-size:20px;font-weight:900}#gf p{margin:0 0 6px;color:#51656d;font-size:13px}#gf label{text-align:right;color:#51656d}#gf input{background:#fff;color:#12303a;border-color:#d5e0e3}#ge{min-height:20px;color:#b3261e;font-size:13px;margin:8px 0}#gf button{width:100%;background:#0a6f82;color:#fff;border-color:#0a6f82}
@media print{#app,#hold,#gate{display:none!important}body{background:#fff}#sheet{display:grid;grid-template-columns:repeat(2,85.6mm);gap:8mm;justify-content:center}
.pc{width:85.6mm;height:54mm;overflow:hidden;border-radius:3mm;break-inside:avoid;position:relative}.pc>div{width:960px;height:600px;transform:scale(.337);transform-origin:0 0}
@page{size:A4;margin:12mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

<div style="${lb}">نام و نام خانوادگی</div>

const card=$('#card'),vp=$('#vp'),st=$('#st'),say=m=>st.textContent=m;
const FG={'مشخصات دانش‌آموز':[['name','نام و نام خانوادگی'],['grade','پایه (دهم / یازدهم / دوازدهم)'],['cls','کلاس']],'اطلاعات مدرسه و کارت':[['year','سال تحصیلی'],['tag','عنوان کارت'],['t1','عنوان مرکز'],['t2','نام مدرسه'],['pname','نام مدیر'],['prole','سمت مدیر']]};
$('#forms').innerHTML=Object.entries(FG).map(([g,f],i)=>`<fieldset id="s${i+2}"><legend>${g}</legend>${f.map(([k,l])=>`<label for="f_${k}">${l}</label><input type="text" id="f_${k}" data-k="${k}" autocomplete="off">`).join('')}</fieldset>`).join('');
$('#themes').innerHTML=TH.map((t,i)=>`<button class="sw" data-t="${i}" title="${t.n}" aria-label="${t.n}" style="background:linear-gradient(100deg,${t.g.join(',')})"></button>`).join('');
function fit(){const sg=$('#stage'),nr=innerWidth<=1000,k=Math.max(.1,Math.min(1.3,(sg.clientWidth-28)/960,nr?9:(sg.clientHeight-28)/600));card.style.transform=`scale(${k})`;vp.style.width=960*k+'px';vp.style.height=600*k+'px'}
function draw(){card.innerHTML=cardHTML(cur());fit()}
function lst(){$('#list').innerHTML=S.students.map((s,i)=>`<div class="it${i==S.cur?' on':''}"><button data-s="${i}">${esc(s.name||'بدون نام')} — ${esc(s.grade)} ${esc(fa(s.cls))}</button><button data-d="${i}" aria-label="حذف">✕</button></div>`).join('')}
function fill(){const d=cur();document.querySelectorAll('[data-k]').forEach(e=>e.value=d[e.dataset.k]);['z','x','y'].forEach(k=>$('#'+k).value=d[k]);$('#bg').checked=S.bg;document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.t==S.theme))}
const all=()=>{save();draw();lst()};
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k){cur()[k]=e.target.value;all()}else if('zxy'.includes(e.target.id)&&e.target.type=='range'){cur()[e.target.id]=+e.target.value;all()}});
$('#bg').onchange=e=>{S.bg=e.target.checked;all()};
$('#themes').onclick=e=>{const b=e.target.closest('.sw');if(b){S.theme=+b.dataset.t;fill();all()}};
$('#list').onclick=e=>{const s=e.target.closest('[data-s]'),x=e.target.closest('[data-d]');if(s){S.cur=+s.dataset.s}else if(x){if(S.students.length<2)return say('حداقل یک دانش‌آموز باید در فهرست بماند.');S.students.splice(+x.dataset.d,1);S.cur=Math.min(S.cur,S.students.length-1)}else return;fill();all()};
$('#add').onclick=()=>{const c=cur();S.students.push({...def(),name:'',cls:'',grade:c.grade,year:c.year,pname:c.pname,prole:c.prole,t1:c.t1,t2:c.t2,tag:c.tag});S.cur=S.students.length-1;fill();all();$('#f_name').focus()};
$('#rm').onclick=()=>{Object.assign(cur(),{photo:'',z:100,x:0,y:0});fill();all()};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const r=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*r;c.height=im.height*r;c.getContext('2d').drawImage(im,0,0,c.width,c.height);Object.assign(cur(),{photo:c.toDataURL('image/jpeg',.9),z:100,x:0,y:0});URL.revokeObjectURL(im.src);fill();all()};im.onerror=()=>say('این فایل به‌عنوان تصویر خوانده نشد.');im.src=URL.createObjectURL(f);e.target.value=''};
new ResizeObserver(fit).observe($('#stage'));

const hold=$('#hold');
async function shot(d){hold.innerHTML=cardHTML(d);const el=hold.firstElementChild;await document.fonts.ready;await Promise.all([...el.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));return html2canvas(el,{scale:3,backgroundColor:null,logging:false})}
const flat=c=>{const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);x.drawImage(c,0,0);return o};
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
const jpg=async c=>new Uint8Array(await(await toBlob(c,'image/jpeg',.95)).arrayBuffer());
function pdf(pages,pw,ph){const E=s=>new TextEncoder().encode(s),parts=[],off={};let len=0;const add=b=>{parts.push(b);len+=b.length};
const ob=(n,b)=>{off[n]=len;add(E(`${n} 0 obj\n`));add(typeof b=='string'?E(b):b);add(E('\nendobj\n'))};
add(E('%PDF-1.4\n'));ob(1,'<</Type/Catalog/Pages 2 0 R>>');ob(2,`<</Type/Pages/Kids[${pages.map((_,i)=>3+3*i+' 0 R').join(' ')}]/Count ${pages.length}>>`);
pages.forEach((p,i)=>{const a=3+3*i;ob(a,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</I ${a+1} 0 R>>>>/Contents ${a+2} 0 R>>`);
off[a+1]=len;add(E(`${a+1} 0 obj\n<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.j.length}>>\nstream\n`));add(p.j);add(E('\nendstream\nendobj\n'));
const c=`q ${pw} 0 0 ${ph} 0 0 cm /I Do Q`;ob(a+2,`<</Length ${c.length}>>\nstream\n${c}\nendstream`)});
const N=3+3*pages.length,x=len;let t=`xref\n0 ${N}\n0000000000 65535 f \n`;for(let i=1;i<N;i++)t+=String(off[i]).padStart(10,'0')+' 00000 n \n';
add(E(t+`trailer\n<</Size ${N}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`));return new Blob(parts,{type:'application/pdf'})}
let dl=null;(async()=>{try{dl=await claude.use('downloads')}catch(e){}if(!dl)['png','pdf1','pdfa'].forEach(i=>{$('#'+i).disabled=true;$('#'+i).title='ذخیره فایل در این نما در دسترس نیست؛ از چاپ استفاده کنید'})})();
async function put(name,blob){if(!dl)return say('ذخیره فایل در این نما در دسترس نیست؛ از «چاپ» و گزینه ذخیره به‌صورت PDF استفاده کنید.');try{await dl.save({filename:name,data:blob});say('فایل آماده و ذخیره شد.')}catch(e){say(e&&e.code=='declined'?'ذخیره لغو شد.':'ذخیره انجام نشد؛ دوباره تلاش کنید.')}}
async function job(ids,fn){if(!window.html2canvas)return say('کتابخانه خروجی بارگذاری نشد؛ اتصال اینترنت را بررسی کنید.');ids.forEach(i=>$('#'+i).disabled=true);say('در حال ساخت خروجی…');try{await fn()}catch(e){say('ساخت خروجی ناموفق بود.')}ids.forEach(i=>$('#'+i).disabled=!dl)}
const fn=d=>'کارت-'+(d.name||'همیار').trim().replace(/\s+/g,'-');
$('#png').onclick=()=>job(['png'],async()=>put(fn(cur())+'.png',await toBlob(await shot(cur()),'image/png')));
$('#pdf1').onclick=()=>job(['pdf1'],async()=>{const c=flat(await shot(cur()));put(fn(cur())+'.pdf',pdf([{j:await jpg(c),w:c.width,h:c.height}],242.65,153.07))});
$('#pdfa').onclick=()=>job(['pdfa'],async()=>{const W=2480,H=3508,cw=1011,ch=638,gx=94,ox=(W-2*cw-gx)/2,oy=(H-4*ch-3*gx)/2,pages=[];let sh;
for(let i=0;i<S.students.length;i++){if(i%8==0){sh=document.createElement('canvas');sh.width=W;sh.height=H;const x=sh.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);pages.push(sh)}
const c=await shot(S.students[i]),k=i%8,px=ox+(k%2)*(cw+gx),py=oy+Math.floor(k/2)*(ch+gx),x=sh.getContext('2d');x.drawImage(c,px,py,cw,ch);x.strokeStyle='#cfd6d8';x.lineWidth=2;x.strokeRect(px,py,cw,ch)}
put('کارت-همه-دانش‌آموزان-A4.pdf',pdf(await Promise.all(pages.map(async p=>({j:await jpg(p),w:W,h:H}))),595.28,841.89))});
function prt(list){$('#sheet').innerHTML=list.map(d=>`<div class="pc"><div>${cardHTML(d)}</div></div>`).join('');document.fonts.ready.then(()=>{try{window.print()}catch(e){say('چاپ در این نما مسدود است؛ فایل PDF را دانلود و از آن چاپ بگیرید.')}})}
$('#pr1').onclick=()=>prt([cur()]);$('#pra').onclick=()=>prt(S.students);
fill();all();
const KH="a48eba5795cabfffd89c7d4a5cd5ea75af692277fa621e1f2543ebd8b8f95bb5";
const go=()=>{document.body.classList.add('ok');fit()};
$('#gl').src=L1;
try{if(sessionStorage.getItem('hc_ok')==='1')go()}catch(e){}
$('#gf').onsubmit=async e=>{e.preventDefault();const u=$('#gu').value.trim().toLowerCase(),p=$('#gp').value,m=$('#ge');m.textContent='';
if(!(window.crypto&&crypto.subtle))return m.textContent='این مرورگر از ورود امن پشتیبانی نمی‌کند.';
const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(u+':'+p)))].map(x=>x.toString(16).padStart(2,'0')).join('');
if(h===KH){try{sessionStorage.setItem('hc_ok','1')}catch(x){}$('#gp').value='';go()}else{m.textContent='نام کاربری یا رمز عبور نادرست است.';$('#gp').select()}};
$('#out').onclick=()=>{try{sessionStorage.removeItem('hc_ok')}catch(e){}document.body.classList.remove('ok');$('#gu').focus()};
document.querySelector('.nv').onclick=e=>{const b=e.target.closest('[data-j]');if(b)document.getElementById(b.dataset.j).scrollIntoView({behavior:'smooth',block:'start'})};
</script>
